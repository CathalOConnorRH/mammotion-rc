name: "Mammotion Remote"
description: "Home Assistant add-on for mammotion-rc (HC33 Wi-Fi/HaLow or Heltec V3 LoRa)"
version: "1.2.0"
slug: "mammotion_remote"
url: "https://github.com/ontheview/mammotion-rc"
startup: application
boot: auto
init: false

arch:
  - amd64
  - aarch64

host_network: true

# Serial access for the Heltec V3 LoRa base board (USB, CP2102).
uart: true

options:
  lora_serial: null
  lora_mower: ""
schema:
  # Leave empty for HC33 (Wi-Fi/HaLow) mowers.  For the LoRa variant, pick the
  # base board, e.g. /dev/serial/by-id/usb-Silicon_Labs_CP2102_...
  lora_serial: "device(subsystem=tty)?"
  # Mammotion device name of the LoRa mower (e.g. Luba-XXXXXXXX).  When set,
  # run.sh adds/updates its mowers.toml entry (127.0.0.1:9876, link = "lora").
  lora_mower: "str?"

watchdog: "tcp://[HOST]:8443"
